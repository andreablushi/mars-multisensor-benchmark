[project]
name = "mars-multisensor-benchmark"
version = "0.1.0"
description = "Benchmark ground truth over the tiles of the Mars multi-sensor dataset: SWIM ice consistency and buried lava flow reflectors."
readme = "README.md"
authors = [
    { name = "Andrea Blushi", email = "andreablushi@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "mars-multisensor-dataset @ https://github.com/andreablushi/mars-multisensor-dataset/archive/refs/heads/main.tar.gz",
    "httpx>=0.28.1",
    "hydra-core>=1.3.7",
    "numpy>=2.5.2",
    "tifffile>=2026.8.23",
]

[tool.uv.sources]
mars-multisensor-dataset = { path = "../mars-multisensor-dataset", editable = true }

[build-system]
requires = ["uv_build>=0.10.2,<0.11.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = ["common", "ice_consistency", "lavaflow"]

[dependency-groups]
dev = [
    "ruff>=0.16.2",
]
notebook = [
    "cartopy>=0.25.0",
    "ipywidgets>=8.1.5",
    "jupyterlab>=4.3.0",
    "matplotlib>=3.10.0",
    "pandas>=2.2",
    "xarray>=2026.7.0",
]
digitalhub = [
    "digitalhub>=0.16,<0.17",
    "digitalhub-runtime-python>=0.16,<0.17",
]

[tool.ruff]
line-length = 88
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "D"]
ignore = ["D100", "D104"]

[tool.ruff.lint.pydocstyle]
convention = "google"
